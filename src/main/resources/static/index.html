<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RateShaper</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>RateShaper</h1>
            <p>Live Rate Limiting Algorithm Playground</p>
        </header>

        <div class="panels">
            <div class="controls">
                <div class="form-group">
                    <label for="algorithm">Algorithm</label>
                    <select id="algorithm"></select>
                </div>

                <div id="config-fields"></div>

                <div class="form-group">
                    <label for="pattern">Traffic Pattern</label>
                    <select id="pattern">
                        <option value="BURST">Burst</option>
                        <option value="STEADY">Steady</option>
                        <option value="RANDOM">Random</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="totalRequests">Total Requests</label>
                    <input type="number" id="totalRequests" value="30" min="1">
                </div>

                <div class="form-group">
                    <label for="durationMs">Duration (ms)</label>
                    <input type="number" id="durationMs" value="6000" min="100">
                </div>

                <div class="buttons">
                    <button id="startBtn">Start Simulation</button>
                    <button id="resetBtn">Reset</button>
                </div>
            </div>

            <div class="visualization">
                <div class="stats" id="stats">
                    <div>Allowed: <span id="allowedCount" class="stat-value allowed">0</span></div>
                    <div>Blocked: <span id="blockedCount" class="stat-value blocked">0</span></div>
                    <div id="stateDisplay" class="state">Ready</div>
                </div>
                <div class="timeline" id="timeline"></div>
            </div>
        </div>
    </div>
    <script src="/js/app.js"></script>
</body>
</html>
